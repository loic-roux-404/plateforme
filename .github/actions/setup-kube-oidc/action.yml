name: 'Get Tokens and Kubeconfig'
description: 'Retrieves OIDC token, exchanges for Dex token, and generates kubeconfig'
inputs:
  dex-url:
    description: 'Dex URL'
    required: true
  k8s-api-url:
    description: 'Kubernetes API URL'
    required: true
  dex-client-id:
    description: 'Dex client ID'
    default: 'apps-github-actions'
  dex-client-secret:
    description: 'Dex client secret'
    required: true
  kube-ca:
    description: 'Kubernetes CA data'
    required: true
  kubeconfig-path:
    description: 'Path to write the generated kubeconfig file. Expand ~ to HOME; relative paths are resolved from the action working directory.'
    required: false
    default: '~/.kube/config'
outputs:
  dex-token:
    description: 'The Dex token'
  kubeconfig-path:
    description: 'Path to the written kubeconfig file'
runs:
  using: 'node24'
  main: 'index.js'
