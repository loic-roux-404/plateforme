name: 'Test Terraform'

# fmt-only by design: terragrunt validate/plan can never run here — every
# env.hcl calls sops_decrypt_file(find_in_parent_folders("secrets/<env>.yaml"))
# at parse time, and ./secrets is a gitignored symlink to the private
# org-404/secrets repo. Shipping SOPS_AGE_KEY to a public runner is not an
# option. Full validation is `make bootstrap` + `terragrunt plan` locally.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'tf-modules-*/**'
      - 'tf-root-*/**'
      - 'terragrunt/**.hcl'
      - .github/workflows/test-terraform.yml

permissions:
  pull-requests: write

jobs:
  tf-fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v2
      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check -diff -recursive
